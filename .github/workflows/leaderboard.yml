# Лидербоард пересобирается сам: турнир всех танков (ai/ + pool/) гоняется на
# каждый push в master, где поменялись танки, движок или сам расчёт. Зависимости
# не нужны: движок и параллельный пул используют только стандартную библиотеку.
#
# Турнир — круговой: C(N,2) пар × 2 стороны × 5 карт × 3 сида. --jobs 0
# распределяет независимые бои по всем ядрам раннера. Если пул вырастет и турнир
# перестанет укладываться, --deadline остановит прогон, отчёт честно пометится
# неполным, а воркфлоу не упадёт.
#
# Ручной запуск можно выбрать для любой ветки: считается именно она. Для ветки,
# отличной от master, отчёт сохраняется artifact-ом и ничего не коммитит; так
# можно измерить изменение движка до merge. На master отчёт коммитится как раньше.
name: leaderboard

on:
  push:
    branches: [master]
    paths:
      - "pool/**"
      - "ai/**"
      - "engine/**"
      - "config.py"
      - "tools/leaderboard.py"
      - "tools/probe.py"
      - ".github/workflows/leaderboard.yml"
  workflow_dispatch:           # кнопка «Run workflow», можно выбрать ветку

permissions:
  contents: write              # на master коммит обновлённого LEADERBOARD.md

concurrency:
  group: leaderboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4  # push: master; dispatch: выбранная ветка

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Пересчитать лидербоард
        run: python tools/leaderboard.py --deadline 1500 --jobs 0

      - name: Сохранить отчёт тестового запуска
        if: github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-${{ github.run_id }}
          path: LEADERBOARD.md
          retention-days: 7

      - name: Закоммитить обновление в master
        if: github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet -- LEADERBOARD.md; then
            echo "Лидербоард не изменился — коммитить нечего"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md
          git commit -m "лидербоард: автообновление (воркфлоу leaderboard)"
          # мастер мог сдвинуться, пока шёл турнир (мержи pool-PR): пересобираем
          # коммит сверху и пушим, до 3 попыток
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            echo "попытка $i не удалась, повтор через 5 с"
            sleep 5
          done
          echo "не удалось запушить после 3 попыток" >&2
          exit 1
